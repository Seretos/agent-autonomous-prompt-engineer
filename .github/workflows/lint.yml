name: lint

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin manifests and hooks.json are valid JSON
        run: jq empty .claude-plugin/plugin.json .codex-plugin/plugin.json hooks/hooks.json

      # Tier 0 of this plugin, run on itself: frontmatter, LF-only, every
      # ${CLAUDE_PLUGIN_ROOT} reference exists, contract tables agree with
      # the scripts that implement them.
      - name: Tier 0 lint of skills, agents and hooks.json
        run: python3 scripts/lint_prose.py --root . --all

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The scripts start processes, build temp paths and shell out to git;
        # Windows is where the maintainer runs them, Linux is where CI does.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -e ".[test]"

      - name: Run pytest
        run: python -m pytest -q
